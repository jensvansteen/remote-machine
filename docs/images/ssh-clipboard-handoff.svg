<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Clipboard file handoff over SSH</title>
  <desc id="desc">An illustrative diagram showing a laptop screenshot transferred into an SSH terminal on a remote Mac, where a Codex or Claude Code CLI can read its remote path.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <linearGradient id="screen" x1="0" x2="1"><stop stop-color="#182235"/><stop offset="1" stop-color="#0d1422"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".25"/></filter>
  </defs>
  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <text x="56" y="65" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="26" font-weight="700">Clipboard file handoff · SSH terminal</text>
  <text x="56" y="99" fill="#a8b4c7" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16">Illustration · Hammerspoon transfers a file, then types its remote path</text>
  <g filter="url(#shadow)">
    <rect x="55" y="145" width="360" height="295" rx="20" fill="#e2e8f0"/>
    <rect x="72" y="162" width="326" height="242" rx="11" fill="#fff"/>
    <rect x="72" y="162" width="326" height="32" rx="11" fill="#dbe2eb"/>
    <circle cx="91" cy="178" r="5" fill="#fb7185"/><circle cx="109" cy="178" r="5" fill="#fbbf24"/><circle cx="127" cy="178" r="5" fill="#34d399"/>
    <text x="92" y="229" fill="#334155" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" font-weight="600">Laptop clipboard</text>
    <rect x="92" y="250" width="118" height="125" rx="9" fill="#dbeafe"/>
    <rect x="101" y="259" width="100" height="107" rx="5" fill="#bfdbfe"/>
    <path d="M117 341l19-24 16 17 13-13 24 31h-72z" fill="#60a5fa"/>
    <circle cx="176" cy="280" r="9" fill="#fbbf24"/>
    <text x="228" y="283" fill="#475569" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15">Screenshot</text>
    <text x="228" y="309" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13">or Finder file</text>
    <rect x="92" y="385" width="284" height="1" fill="#e2e8f0"/>
    <text x="92" y="415" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13">Press Cmd+Shift+V in SSH terminal</text>
  </g>
  <g>
    <path d="M440 286h280" stroke="#60a5fa" stroke-width="4" stroke-dasharray="10 10"/>
    <path d="M710 273l24 13-24 13" fill="none" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="495" y="244" width="172" height="34" rx="17" fill="#1e3a5f"/>
    <text x="581" y="266" text-anchor="middle" fill="#bfdbfe" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" font-weight="600">Tailscale SSH + SCP</text>
    <text x="580" y="321" text-anchor="middle" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13">Types path after transfer</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="770" y="145" width="375" height="295" rx="18" fill="#0b1220" stroke="#364152" stroke-width="2"/>
    <rect x="770" y="145" width="375" height="39" rx="18" fill="#202b3b"/>
    <circle cx="793" cy="164" r="5" fill="#fb7185"/><circle cx="811" cy="164" r="5" fill="#fbbf24"/><circle cx="829" cy="164" r="5" fill="#34d399"/>
    <text x="852" y="170" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13">mac-mini-dev · remote shell</text>
    <text x="796" y="224" fill="#93c5fd" font-family="SFMono-Regular,Menlo,monospace" font-size="14">$ claude</text>
    <text x="796" y="255" fill="#cbd5e1" font-family="SFMono-Regular,Menlo,monospace" font-size="13">What is in this screenshot?</text>
    <rect x="794" y="274" width="326" height="55" rx="8" fill="#162235"/>
    <text x="810" y="298" fill="#86efac" font-family="SFMono-Regular,Menlo,monospace" font-size="12">/Users/dev/Sync/screenshots/</text>
    <text x="810" y="317" fill="#86efac" font-family="SFMono-Regular,Menlo,monospace" font-size="12">2026-09-26-101200.png</text>
    <text x="796" y="365" fill="#94a3b8" font-family="SFMono-Regular,Menlo,monospace" font-size="12">Codex CLI works in the same way.</text>
    <text x="796" y="397" fill="#64748b" font-family="SFMono-Regular,Menlo,monospace" font-size="11">Agent reads the remote file path from the prompt.</text>
  </g>
  <text x="56" y="488" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13">This is a documentation illustration, not a capture from a running Mac.</text>
</svg>
