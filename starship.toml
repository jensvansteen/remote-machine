# Starship prompt for the dev mini.
# Goal: always know which machine you're commanding — esp. when SSH'd from
# the laptop into the Tailscale-resolved mini.

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$cmd_duration\
$line_break\
$character"""

# Hostname shows only when SSH'd (default ssh_only=true). Style it boldly
# so it can't be missed mid-flow.
[hostname]
ssh_only = true
ssh_symbol = " "
format = "[$ssh_symbol$hostname]($style):"
style = "bold yellow"
trim_at = "."   # short hostname only, not FQDN

# Username shows when SSH'd in or running as root — keeps local prompts terse.
[username]
show_always = false
style_user = "bold cyan"
style_root = "bold red"
format = "[$user]($style)@"

[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold blue"

[git_branch]
symbol = " "
style = "bold purple"

[git_status]
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇡${ahead_count}⇣${behind_count}"
modified = "*"
staged = "+"
untracked = "?"
style = "yellow"

[cmd_duration]
min_time = 2000   # only annotate slow commands (> 2s)
format = " [$duration]($style)"
style = "dim white"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
